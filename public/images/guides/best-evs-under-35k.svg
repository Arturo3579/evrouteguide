<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="20"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#2563eb" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="120" fill="#3b82f6" opacity="0.08"/>
  <circle cx="100" cy="380" r="80" fill="#f97316" opacity="0.1"/>
  
  <!-- Car silhouette (stylized hatchback) -->
  <g transform="translate(250, 180)" filter="url(#shadow)">
    <path d="M 20 120 Q 20 60 80 50 L 180 45 Q 240 40 280 60 L 320 80 Q 350 90 360 120 L 360 160 Q 360 180 340 180 L 300 180 Q 280 180 280 160 L 280 150 L 100 150 L 100 160 Q 100 180 80 180 L 40 180 Q 20 180 20 160 Z" 
          fill="url(#carGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="80" cy="180" r="28" fill="#1e293b"/>
    <circle cx="80" cy="180" r="16" fill="#94a3b8"/>
    <circle cx="300" cy="180" r="28" fill="#1e293b"/>
    <circle cx="300" cy="180" r="16" fill="#94a3b8"/>
    <!-- Windows -->
    <path d="M 85 55 L 175 50 L 175 85 L 70 85 Q 65 70 85 55" fill="#bfdbfe" opacity="0.6"/>
    <path d="M 185 50 L 240 55 L 260 85 L 185 85" fill="#bfdbfe" opacity="0.6"/>
    <!-- Headlight -->
    <ellipse cx="345" cy="105" rx="8" ry="5" fill="#fbbf24"/>
    <!-- Taillight -->
    <ellipse cx="25" cy="105" rx="6" ry="4" fill="#ef4444"/>
    <!-- Charging port indicator -->
    <circle cx="200" cy="110" r="6" fill="#22c55e"/>
    <circle cx="200" cy="110" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Price tag/badge -->
  <g transform="translate(520, 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="70" rx="14" fill="#f97316"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">STARTING AT</text>
    <text x="90" y="55" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="28" font-weight="800">$25,000</text>
  </g>
  
  <!-- Feature icons -->
  <g transform="translate(120, 340)">
    <rect x="0" y="0" width="160" height="60" rx="12" fill="white" opacity="0.9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="25" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">200+ MILE RANGE</text>
    <text x="80" y="45" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Real-world tested</text>
  </g>
  
  <g transform="translate(320, 340)">
    <rect x="0" y="0" width="160" height="60" rx="12" fill="white" opacity="0.9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="25" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FEDERAL TAX CREDIT</text>
    <text x="80" y="45" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Up to $7,500</text>
  </g>
  
  <g transform="translate(520, 340)">
    <rect x="0" y="0" width="160" height="60" rx="12" fill="white" opacity="0.9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="25" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LOW MAINTENANCE</text>
    <text x="80" y="45" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">No oil changes</text>
  </g>
  
  <!-- Title text overlay -->
  <text x="400" y="60" text-anchor="middle" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">AFFORDABLE EV GUIDE 2026</text>
  <text x="400" y="85" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Best electric cars under $35,000</text>
</svg>
